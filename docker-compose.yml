services:
  autolink-web:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8000/api}
        REACT_APP_GOOGLE_CLIENT_ID: ${REACT_APP_GOOGLE_CLIENT_ID:-889045236012-e9ahdo1fip8jg0d8cgmsrr3sr6rogfli.apps.googleusercontent.com}
    container_name: autolink-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - autolink-api

  autolink-api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: autolink-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DEBUG: "False"
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:8080}
      COMMISSION_RATE: "0.15"
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/db.sqlite3}   # postgres://... en prod
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:8080}
      FCFA_PER_USD: ${FCFA_PER_USD:-600}
      # Paiements live — renseigner dans Dokploy ou le .env de compose
      STRIPE_API_KEY: ${STRIPE_API_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-}
      PAYPAL_MODE: ${PAYPAL_MODE:-sandbox}
      PAYPAL_PAYOUTS_ENABLED: ${PAYPAL_PAYOUTS_ENABLED:-false}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    volumes:
      - autolink-db:/app/data

volumes:
  autolink-db:
